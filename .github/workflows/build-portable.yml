name: 打包绿色版(Windows)

# 产出一个免安装文件夹: 自带 Python(含 tkinter) + playwright + Chromium + 程序代码。
# 只带程序, 不带任何用户数据/登录凭证 —— 由 tools/build_portable.py 的白名单与扫描保证。
on:
  workflow_dispatch:
    inputs:
      note:
        description: "备注(只影响 Release 说明)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.14"        # 与开发机一致; runner 上若没有该版本, 改这里(见 requirements.txt 的 playwright 版本也要跟着核)
  PLAYWRIGHT_VERSION: "1.62.0"  # 与 requirements.txt 保持同步
  FULL: build/full              # 全量版: 自带解释器 + 依赖 + Chromium, 双击即用
  CORE: build/core              # 核心版: 只有程序, 用本机 Python, 缺的依赖启动后引导安装
  PKG_NAME: liushui-export-portable-win64
  # runner 是英文区域, stdout 接的是管道 → Python 按 cp1252 建流, 中文一 print 就
  # UnicodeEncodeError(第一次构建就死在 build_portable 的第一行日志上)。脚本自己会兜
  # (harden_streams), 这里再兜一层: pytest 失败报告的断言文案也是中文的。
  # 只设 PYTHONIOENCODING 不设 PYTHONUTF8 —— 后者连 open() 的默认编码一起改, 会和开发机不一致。
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 交代本机有哪些解释器(启动工具.vbs 的 CI 分支只有打印可信)
        shell: pwsh
        run: |
          "py --list-paths:"; if (Get-Command py -ErrorAction SilentlyContinue) {
            & py --list-paths
          } else { "  (这台机器没有 py 启动器 —— test_launcher_vbs 的相应分支会跳过)" }
          "python: $((Get-Command python).Source)"

      - name: 核版本(代码 / requirements.txt / 工作流 三处必须是同一个 playwright)
        shell: pwsh
        run: |
          python -c "import io,re,sys;from core import deps;req=re.search(r'playwright==([0-9.]+)',io.open('requirements.txt',encoding='utf-8').read()).group(1);ci='$env:PLAYWRIGHT_VERSION';code=deps.REQUIRED_PLAYWRIGHT_VERSION;print('code=',code,' requirements=',req,' ci=',ci);sys.exit(0 if code==req==ci else 1)"
          if ($LASTEXITCODE -ne 0) { throw "三处版本不一致: 发出去的包会是一个从没实测过的组合(内核目录名带版本, 混版本直接起不来)" }

      # 版本号只写在 core/version.APP_VERSION 一处: 界面标题、程序里比对远端版本、这一步,
      # 三处都从它取。tag 与常量不一致时"检查更新"要么永远查不到这一版, 要么把它当成回退。
      - name: 核程序版本(tag 必须等于 vportable_ + APP_VERSION)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          python -c "import os,sys;from core import version;print('APP_VERSION=',version.APP_VERSION,' TAG=',os.environ['TAG_NAME'],' RELEASE_REPO=',version.RELEASE_REPO);sys.exit(0 if os.environ['TAG_NAME']=='vportable_'+version.APP_VERSION else 1)"
          if ($LASTEXITCODE -ne 0) { throw "tag 与 core/version.APP_VERSION 不一致: 先把常量改对再打 tag, 否则用户那边「检查更新」查不到这一版(或版本号对不上)" }
          # 公开仓的名字交给后面的发布步骤 —— 两处各写一份迟早会分叉, 程序就会去查一个空仓
          $repo = (python -c "from core import version;print(version.RELEASE_REPO)").Trim()
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "RELEASE_REPO=$repo" + [Environment]::NewLine)

      - name: 组装两个版本的程序目录(白名单复制 + 各自的启动器与说明)
        run: |
          python tools/build_portable.py --out $env:FULL --verify
          python tools/build_portable.py --out $env:CORE --flavor core --verify

      - name: 装运行依赖进全量包
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir --target "$env:FULL\app\site-packages" playwright==${{ env.PLAYWRIGHT_VERSION }}

      - name: 装 Chromium 进全量包(必须由同版本 playwright 生成)
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\build\full\app\runtime\ms-playwright
          PYTHONPATH: ${{ github.workspace }}\build\full\app\site-packages
        run: python -m playwright install chromium

      - name: 拷解释器进全量包(含 tkinter 所需的 tcl/tk)
        shell: pwsh
        run: |
          $src = $env:pythonLocation
          if (-not (Test-Path "$src\Lib\tkinter")) { throw "解释器目录里没有 tkinter: $src" }
          Copy-Item -Path $src -Destination "$env:FULL\python" -Recurse -Force
          & "$env:FULL\python\python.exe" -c "import tkinter, sys; print('bundled python', sys.version.split()[0], 'tkinter', tkinter.TkVersion)"

      - name: 冒烟测试 —— 用全量包内的解释器, 从包内 site-packages 起一次真浏览器
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\$env:FULL\app\site-packages;$PWD\$env:FULL\app"
          $env:LIUSHUI_DATA_DIR = "$PWD\build\smoke-workspace"
          Push-Location "$env:FULL\app"
          & "..\python\python.exe" -c @"
          from core import config, deps
          from core.browser import BrowserManager
          d = deps.probe()
          print('deps   :', d.verdict, d.version, d.kernel_dir)
          assert d.verdict == deps.OK, '包内自检没过, 后面不必再跑'
          b = BrowserManager(headless=True)
          b.start()
          b.navigate('about:blank')
          print('page title ok:', isinstance(b.get_page_info().get('title', ''), str))
          b.close()
          "@
          if ($LASTEXITCODE -ne 0) { throw "包内冒烟测试失败" }
          Pop-Location

      - name: 核心版冒烟 —— 只跑不依赖 playwright 的那部分(路径与体检)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\$env:CORE\app"
          $env:LIUSHUI_DATA_DIR = "$PWD\build\core-workspace"
          Push-Location "$env:CORE\app"
          python -c "from core import config, deps; d = deps.probe(); print('core 版在这台机器上的体检:', d.verdict, d.kernel_dir); assert d.verdict in (deps.NO_PACKAGE, deps.NO_KERNEL, deps.UNKNOWN), d.verdict; print('启动器会引导装的东西:', [deps.show(a) for _t, a in deps.fix_commands(d)])"
          if ($LASTEXITCODE -ne 0) { throw "核心版自检失败: 体检没能认出'这台机器上没有随包依赖'" }
          Pop-Location

      - name: 离线测试仓库代码(不含 GUI 的部分)
        run: |
          python -m pip install --no-cache-dir pytest
          # 依赖不再下一遍: tests/conftest.py 会把**包内** site-packages 挂进 sys.path
          # (那份本来就要随包发出去, 为跑测试再装一份纯属浪费)。先断言它在, 否则报出来的
          # 是"没有 playwright"这种莫名其妙错(第一次 CI 就是这么红的)。
          if (-not (Test-Path "$env:FULL\app\site-packages\playwright")) {
            throw "包内依赖不在: $env:FULL\app\site-packages —— conftest 挂不到东西"
          }
          python -m pytest tests -q

      - name: 压缩两个成品
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$env:FULL\*" -DestinationPath "dist\$env:PKG_NAME-full.zip" -Force
          Compress-Archive -Path "$env:CORE\*" -DestinationPath "dist\$env:PKG_NAME-core.zip" -Force
          Get-ChildItem dist\*.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传 artifact(每次运行都可下载)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: |
            dist/${{ env.PKG_NAME }}-full.zip
            dist/${{ env.PKG_NAME }}-core.zip
          if-no-files-found: error

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.PKG_NAME }}-full.zip
            dist/${{ env.PKG_NAME }}-core.zip
          body: |
            两个包, 程序部分完全一样, 区别只在带不带依赖:

            - **`-full`(全量版)** —— 自带 Python + playwright + Chromium, 解压后双击
              `run-portable.vbs`, 不需要装任何东西、不需要联网下依赖。**发给业务用户就给这个。**
              第一次启动会让你选一个存放账单与登录数据的工作空间目录。
              双击没反应时改用 `run-portable.bat`, 报错会留在窗口里。
            - **`-core`(核心版)** —— 只有程序, 几 MB。这台电脑要有 Python 3.10+, 第一次启动
              会检查缺什么并引导安装 playwright 与浏览器内核(需要联网, 约 1-3 分钟)。
              双击 `run-core.vbs`; 排错用 `run-core.bat`, 它会先打印用的是哪个 Python。
              内网装不上时看包里的 `README-核心版.txt`(可以只拷内核目录 + 设
              `PLAYWRIGHT_BROWSERS_PATH`, 或者直接改用全量版)。
            ${{ github.event.inputs.note }}

      # 「检查更新」在程序里查的是**公开仓**的那份资产: 代码仓私有, 匿名读 Release 实测 404,
      # 而业务用户手上没有 GitHub 权限。没配 secret 就直接失败, 不许默默只发私有仓 ——
      # 那样 CI 是绿的, 而所有人的「检查更新」永远查不到这一版。
      - name: 公开 release 仓的 token 配了没有
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:RELEASE_TOKEN) {
            throw "仓库 secrets 里缺 RELEASE_TOKEN(一个对公开仓 $env:RELEASE_REPO 有 contents:write 的 fine-grained token), 这一版发不到「检查更新」查的地方"
          }

      - name: 同一份资产再发到公开 release 仓
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: ${{ env.RELEASE_REPO }}
          tag_name: ${{ github.ref_name }}
          make_latest: true
          files: |
            dist/${{ env.PKG_NAME }}-full.zip
            dist/${{ env.PKG_NAME }}-core.zip
          body: |
            程序版本 v${{ github.ref_name }}。工具里「检查更新」下的就是这里的 `-core.zip`
            (只换程序文件, 不动依赖/内核/账单/登录态); 第一次装请用 `-full`。

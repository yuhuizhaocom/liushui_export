name: 打包绿色版(Windows)

# 产出一个免安装文件夹: 自带 Python(含 tkinter) + playwright + Chromium + 程序代码。
# 只带程序, 不带任何用户数据/登录凭证 —— 由 tools/build_portable.py 的白名单与扫描保证。
on:
  workflow_dispatch:
    inputs:
      note:
        description: "备注(只影响 Release 说明)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.14"        # 与开发机一致; runner 上若没有该版本, 改这里(见 requirements.txt 的 playwright 版本也要跟着核)
  PLAYWRIGHT_VERSION: "1.62.0"  # 与 requirements.txt 保持同步
  PKG: build/pkg
  PKG_NAME: liushui-export-portable-win64
  # runner 是英文区域, stdout 接的是管道 → Python 按 cp1252 建流, 中文一 print 就
  # UnicodeEncodeError(第一次构建就死在 build_portable 的第一行日志上)。脚本自己会兜
  # (harden_streams), 这里再兜一层: pytest 失败报告的断言文案也是中文的。
  # 只设 PYTHONIOENCODING 不设 PYTHONUTF8 —— 后者连 open() 的默认编码一起改, 会和开发机不一致。
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 组装程序目录(白名单复制 core/platforms/tools + 启动器)
        run: python tools/build_portable.py --out $env:PKG

      - name: 装运行依赖进包
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir --target "$env:PKG\app\site-packages" playwright==${{ env.PLAYWRIGHT_VERSION }}

      - name: 装 Chromium 进包(必须由同版本 playwright 生成)
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\build\pkg\app\runtime\ms-playwright
          PYTHONPATH: ${{ github.workspace }}\build\pkg\app\site-packages
        run: python -m playwright install chromium

      - name: 拷解释器进包(含 tkinter 所需的 tcl/tk)
        shell: pwsh
        run: |
          $src = $env:pythonLocation
          if (-not (Test-Path "$src\Lib\tkinter")) { throw "解释器目录里没有 tkinter: $src" }
          Copy-Item -Path $src -Destination "$env:PKG\python" -Recurse -Force
          & "$env:PKG\python\python.exe" -c "import tkinter, sys; print('bundled python', sys.version.split()[0], 'tkinter', tkinter.TkVersion)"

      - name: 冒烟测试 —— 用包内解释器, 从包内 site-packages 起一次真浏览器
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\$env:PKG\app\site-packages;$PWD\$env:PKG\app"
          $env:LIUSHUI_DATA_DIR = "$PWD\build\smoke-workspace"
          Push-Location "$env:PKG\app"
          & "..\python\python.exe" -c @"
          from core import config
          from core.browser import BrowserManager, resolve_browsers_path
          print('workspace:', config.DATA_ROOT)
          print('browsers :', resolve_browsers_path(env={}))
          b = BrowserManager(headless=True)
          b.start()
          b.navigate('about:blank')
          print('page title ok:', isinstance(b.get_page_info().get('title', ''), str))
          b.close()
          "@
          if ($LASTEXITCODE -ne 0) { throw "包内冒烟测试失败" }
          Pop-Location

      - name: 离线测试仓库代码(不含 GUI 的部分)
        run: |
          python -m pip install --no-cache-dir pytest
          python -m pytest tests -q

      - name: 压缩成品
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$env:PKG\*" -DestinationPath "dist\$env:PKG_NAME.zip" -Force
          Get-Item "dist\$env:PKG_NAME.zip" | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传 artifact(每次运行都可下载)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: dist/${{ env.PKG_NAME }}.zip
          if-no-files-found: error

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.PKG_NAME }}.zip
          body: |
            绿色版(Windows x64, 免安装)。解压后双击 `run-portable.vbs`;
            第一次会让你选一个存放账单与登录数据的工作空间目录。
            双击没反应时改用 `run-portable.bat`, 报错会留在窗口里。
            ${{ github.event.inputs.note }}
